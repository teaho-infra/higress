admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 19000}
static_resources:
  listeners:
  - name: private-build-smoke
    address:
      socket_address: {address: 0.0.0.0, port_value: 18080}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: private_build_smoke
          route_config:
            name: smoke-route
            virtual_hosts:
            - name: smoke
              domains: ['*']
              routes:
              - match: {prefix: /}
                direct_response:
                  status: 200
                  body: {inline_string: 'higress-private-build-ok'}
          http_filters:
          - name: envoy.filters.http.golang
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.Config
              library_id: private-build-filter
              library_path: /var/lib/istio/envoy/golang-filter.so
              plugin_name: mcp-session
              plugin_config:
                '@type': type.googleapis.com/xds.type.v3.TypedStruct
                value:
                  sse_path_suffix: /sse
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
